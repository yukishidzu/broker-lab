<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Broker Lab — интерактивная памятка о пути сообщений в Kafka и RabbitMQ." />
    <meta name="theme-color" content="#14161a" />
    <script>
      try {
        const saved = localStorage.getItem('broker-lab-theme');
        const dark = saved === 'dark' || ((!saved || saved === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.style.background = dark ? '#14161a' : '#f5f6f8';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#14161a' : '#f5f6f8';
      } catch {}
    </script>
    <title>Broker Lab — путь сообщения</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
